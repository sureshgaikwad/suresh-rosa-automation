# Copy this file to your gitops-catalog repo as:
#   operators/developer-hub/base/kustomization.yaml
#
# The root operators/developer-hub/kustomization.yaml references files that live
# under base/, so Kustomize fails with "demo-project-namespace.yaml: no such file".
# Using path operators/developer-hub/base and this kustomization fixes the ArgoCD error.
---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: demo-project

resources:
  - demo-project-namespace.yaml
  - pvc-dynamic-plugins.yaml
  - auth-secret.yaml
  - app-config.yaml
  - dynamic-plugins.yaml
  - user-entities.yaml
  - rbac.yaml
  - backstage-instance.yaml
