apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: developer-hub-template-runner
  namespace: demo-project
rules:
  - apiGroups: [""]
    resources: ["configmaps", "secrets", "serviceaccounts"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: developer-hub-template-runner
  namespace: demo-project
subjects:
  - kind: ServiceAccount
    name: developer-hub
    namespace: demo-project
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: developer-hub-template-runner
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: agentic-platform-admins-cluster-admin
subjects:
  - kind: Group
    apiGroup: rbac.authorization.k8s.io
    name: platform-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
