apiVersion: v1
kind: ConfigMap
metadata:
  name: agentic-model-contract
  namespace: models
  labels:
    app.kubernetes.io/name: agentic-model-contract
    app.kubernetes.io/part-of: agentic-dev-platform
data:
  OPENAI_API_BASE: "http://qwen-25-7b-predictor.models.svc.cluster.local:8080/v1"
  OPENAI_MODEL_ID: "qwen-25-7b"
  OPENAI_AUTH_MODE: "none"
  REQUEST_TIMEOUT_SECONDS: "60"
  MAX_RETRIES: "2"
  MAX_INPUT_TOKENS: "32768"
  MAX_OUTPUT_TOKENS: "2048"
  LATENCY_SLO_P95_MS: "2500"
  ERROR_RATE_SLO_PERCENT: "1"
